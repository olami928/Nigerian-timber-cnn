name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'configs/**'
      - 'data/manifest.csv'
      - '.github/workflows/android-apk.yml'
      - 'vercel.json'

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build web assets and sync Android
        working-directory: app
        run: |
          npm ci
          npm run build
          rm -rf android/app/src/main/assets/public
          cp -R public android/app/src/main/assets/public

      - name: Assemble debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          ls -lh app/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timber-id-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
